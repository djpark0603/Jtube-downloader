<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TubeDownloader | Premium Video Extraction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <main class="container">
    <header>
      <h1 class="hero-title">Download with <br>Style.</h1>
      <p class="hero-subtitle">Enter a YouTube link below to extract high-quality video content instantly.</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false" autocomplete="off">
        <button class="btn-download" id="download-btn">
          <span>Download</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
      <p id="status" class="status-msg">Processing your request...</p>
    </section>

    <article id="preview" class="preview-card">
      <!-- Video preview details will be injected here -->
    </article>
  </main>

  <!-- Download Modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      <div id="modal-body">
        <div class="video-info">
          <img id="modal-thumbnail" src="" alt="Thumbnail" class="modal-thumbnail">
          <h2 id="modal-title" class="modal-title">Video Title</h2>
        </div>
        <div class="download-list" id="modal-download-list">
          <!-- Download options will be injected here -->
        </div>
      </div>
    </div>
  </div>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
